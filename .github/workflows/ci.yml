name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  lint:
    runs-on: ubuntu-latest
    container: crystallang/crystal:latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: shards install --ignore-crystal-version
    - name: Lint
      run: ./bin/ameba
    - name: Format
      run: crystal tool format --check
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        crystal:
          - latest
          - nightly
    runs-on: ${{ matrix.os }}
    container: crystallang/crystal:${{ matrix.crystal }}
    steps:
    - uses: actions/checkout@v4
    # ameba (a development dependency) does not always compile on nightly Crystal,
    # so skip development dependencies here. Linting runs in the dedicated lint job.
    - name: Install dependencies
      run: shards install --ignore-crystal-version --without-development
    # The spec compiles examples/dtls_server.cpp (an OpenSSL DTLS echo server)
    # with g++ and launches it itself, so we just need a C++ toolchain and the
    # OpenSSL development headers.
    - name: Install build dependencies
      run: apt update && apt -y install g++ libssl-dev
    - name: Run tests
      run: crystal spec -v --error-trace
