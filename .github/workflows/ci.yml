name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  lint:
    runs-on: ubuntu-latest
    container: crystallang/crystal:latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: shards install --ignore-crystal-version
    - name: Lint
      run: ./bin/ameba
    - name: Format
      run: crystal tool format --check
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        crystal:
          - latest
          - nightly
    runs-on: ${{ matrix.os }}
    container: crystallang/crystal:${{ matrix.crystal }}
    steps:
    - uses: actions/checkout@v4
    # ameba (a development dependency) does not always compile on nightly Crystal,
    # so skip development dependencies here. Linting runs in the dedicated lint job.
    - name: Install dependencies
      run: shards install --ignore-crystal-version --without-development
    - name: Install build dependencies
      run: apt update && apt -y install curl make m4
    - name: Build test server
      run: git clone https://github.com/nodertc/test-dtls-server && cd test-dtls-server && make
    - name: Start test server
      run: cd test-dtls-server && export CERTFILE=./cert-rsa.pem && export KEYFILE=./key-rsa.pem && ./dtlsd &
    - name: Run tests
      run: crystal spec -v --error-trace
